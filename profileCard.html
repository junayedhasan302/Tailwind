<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junayed Hasan - Profile Card</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body class="min-h-screen bg-gray-400 flex items-center justify-center p-4">
    <!-- Card -->
    <div
        class="relative w-full max-w-[530px] min-h-[690px] overflow-hidden rounded-[55px] bg-white shadow-xl">
        <!-- Red Banner -->
        <div class="h-[320px] w-full border-[4px] border-red-600 bg-gradient-to-br from-red-500 via-red-600 to-red-800"></div>

        <!-- Profile Image -->
        <div class="absolute left-1/2 top-[215px] -translate-x-1/2 w-[190px] h-[190px] rounded-full border-[5px] outline-indigo-50 overflow-hidden bg-red-800">
            <img src="IMG_20250716_230934.jpg" alt="Junayed Hasan" class="w-full h-full object-cover">
        </div>

        <!-- Profile Content -->
        <div class="flex flex-col items-center px-6 pt-[75px]">
            <!-- Name -->
            <h1 class="text-center text-[34px] font-bold tracking-tight text-gray-800"> Junayed Hasan </h1>
            <!-- Profession -->
            <p class="mt-1 text-[20px] font-medium text-red-600">Web Developer </p>
            <!-- Divider -->
            <div class="mt-6 h-[3px] w-[320px] max-w-full bg-red-600"></div>
            <!-- Description -->
            <p class="mt-5 max-w-[360px] text-center text-[17px] leading-7 text-gray-500">
                Passionate about building clean, responsive
                and modern web experiences.
            </p>
            <!-- Social Icons -->
            <div class="mt-10 flex items-center gap-8">
                <!-- Instagram -->
                <a href="https://www.instagram.com/jhjunayed" class="flex h-12 w-12 items-center justify-center rounded-full bg-red-700 text-white text-xl transition duration-300 hover:scale-110 hover:bg-red-800">
                    <i class="fa-brands fa-instagram"></i>
                </a>
                <!-- Twitter -->
                <a href="https://x.com/junayed_jh" class="flex h-12 w-12 items-center justify-center rounded-full bg-red-700 text-white text-xl transition duration-300 hover:scale-110 hover:bg-red-800">
                    <i class="fa-brands fa-twitter"></i>
                </a>
                <!-- Facebook -->
                <a href="http://facebook.com/junayed.hasan.302/" class="flex h-12 w-12 items-center justify-center rounded-full bg-red-700 text-white text-xl transition duration-300 hover:scale-110 hover:bg-red-800">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
