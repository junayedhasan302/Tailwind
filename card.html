    lg:p-8
    xl:p-10

        lg:max-w-5xl

            text-center
            mb-5
            sm:mb-6
            md:mb-7

            Card BABA

            sm:gap-5
            lg:gap-6
            xl:gap-7
            p-4
            sm:p-5
            lg:p-6
            xl:p-8
            bg-white/10
            backdrop-blur-md
            border
            border-white/20
            rounded-2xl
            sm:rounded-3xl
            shadow-2xl

                md:h-52

                font-bold
                shadow-lg
