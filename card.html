<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Collection</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900
             flex items-center justify-center p-6">

    <div>
        <!-- Heading -->
        <h1 class="text-4xl font-bold text-white text-center mb-6">
            Card BABA
        </h1>

        <!-- Main Section -->
        <section class="bg-white/10 backdrop-blur-md
                        border border-white/20
                        rounded-3xl
                        w-100 p-4
                        grid grid-cols-2 gap-4
                        shadow-2xl">

            <!-- Card 1 -->
            <div class="h-36 rounded-2xl
                        bg-[url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Family_Portrait.jpg')]
                        bg-cover bg-center
                        flex items-end justify-center
                        p-3
                        text-white font-bold
                        shadow-lg
                        hover:scale-105
                        hover:shadow-2xl
                        transition duration-300">
                <span class="bg-black/50 px-3 py-1 rounded-lg">
                    Family Card
                </span>
            </div>


            <!-- Card 2 -->
            <div class="h-36 rounded-2xl
                        bg-[url('https://tinyurl.com/m7dhwhx7')]
                        bg-cover bg-center
                        flex items-end justify-center
                        p-3
                        text-white font-bold
                        shadow-lg
                        hover:scale-105
                        hover:shadow-2xl
                        transition duration-300">
                <span class="bg-black/50 px-3 py-1 rounded-lg">
                    Current Card
                </span>
            </div>


            <!-- Card 3 -->
            <div class="h-36 rounded-2xl
                        bg-[url('https://www.shutterstock.com/shutterstock/photos/2225305455/display_1500/stock-vector-the-risen-dead-from-a-wooden-coffin-vector-illustration-with-black-lines-isolated-on-white-2225305455.jpg')]
                        bg-cover bg-center
                        flex items-end justify-center
                        p-3
                        text-white font-bold
                        shadow-lg
                        hover:scale-105
                        hover:shadow-2xl
                        transition duration-300">
                <span class="bg-black/50 px-3 py-1 rounded-lg">
                    Coffin Card
                </span>
            </div>


            <!-- Card 4 -->
            <div class="h-36 rounded-2xl
                        bg-[url('https://images.unsplash.com/photo-1500534623283-312aade485b7')]
                        bg-cover bg-center
                        flex items-end justify-center
                        p-3
                        text-white font-bold
                        shadow-lg
                        hover:scale-105
                        hover:shadow-2xl
                        transition duration-300">
                <span class="bg-black/50 px-3 py-1 rounded-lg">
                    Nature Card
                </span>
            </div>


            <!-- Card 5 -->
            <div class="h-36 rounded-2xl
                        bg-[url('https://images.unsplash.com/photo-1519681393784-d120267933ba')]
                        bg-cover bg-center
                        flex items-end justify-center
                        p-3
                        text-white font-bold
                        shadow-lg
                        hover:scale-105
                        hover:shadow-2xl
                        transition duration-300">
                <span class="bg-black/50 px-3 py-1 rounded-lg">
                    Mountain Card
                </span>
            </div>


            <!-- Card 6 -->
            <div class="h-36 rounded-2xl
                        bg-[url('https://images.unsplash.com/photo-1493246507139-91e8fad9978e')]
                        bg-cover bg-center
                        flex items-end justify-center
                        p-3
                        text-white font-bold
                        shadow-lg
                        hover:scale-105
                        hover:shadow-2xl
                        transition duration-300">

                <span class="bg-black/50 px-3 py-1 rounded-lg">
                    Travel Card
                </span>
            </div>

        </section>
    </div>
</body>
</html>
