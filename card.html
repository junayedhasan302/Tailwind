<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <h1 class="text-green-800">
        Card BABA
    </h1>
    <section class="bg-purple-500 border-2 border-purple-800 rounded-xl h-150 w-100 flex">
        <div class="border-2 border-red-800 rounded-2xl
                   h-30 w-40 p-3 ml-1 mt-1.5
                   bg-[url('https://commons.wikimedia.org/wiki/Special:Redirect/file/Family_Portrait.jpg')]
                   bg-cover bg-center
                   flex items-end justify-center
                   text-white font-bold">
            Family Card
        </div>
        <div class="border-2 border-red-800 rounded-xl
                   h-30 w-40 p-3 ml-1 mt-1.5
                   bg-[url('https://tinyurl.com/m7dhwhx7')]
                   bg-cover bg-center
                   flex items-end justify-center
                   text-white font-bold">
            Current Card
        </div>
        <div class="border-2 border-red-800 rounded-xl
                   h-30 w-40 p-3 ml-1 mt-1.5
                   bg-[url('https://www.shutterstock.com/shutterstock/photos/2225305455/display_1500/stock-vector-the-risen-dead-from-a-wooden-coffin-vector-illustration-with-black-lines-isolated-on-white-2225305455.jpg')]
                   bg-cover bg-center
                   flex items-end justify-center
                   text-black font-bold">
            Coffin Card
        </div>

    </section>

</body>

</html>
